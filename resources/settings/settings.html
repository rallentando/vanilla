<!DOCTYPE html>
<!-- 'loading' keeps the page invisible until the script has drawn it
     (settings.css, D-537): a frame of the bare markup is never painted. -->
<html class="loading">
  <head>
    <meta charset="utf-8">
    <!-- both of these are replaced from the schema, which carries them
         translated: the one the application writes into the page below
         ('#schema', D-537), or '/api/schema' where the page came without
         it. The English here shows only in that second case. -->
    <title>Settings</title>
    <link rel="stylesheet" href="/settings.css">
  </head>
  <body>
    <header>
      <h1 id="title">Settings</h1>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
    </header>

    <div id="layout">
      <nav id="nav"></nav>
      <main id="main">
        <p id="empty" hidden></p>
      </main>
    </div>

    <div id="toast" hidden></div>

    <script src="/settings.js"></script>
  </body>
</html>
